name: Publish to PyPI

# Runs when a GitHub Release is published. Uses PyPI "trusted publishing" (OIDC):
# no API token is stored in the repository. One-time setup on pypi.org →
# project sdt-netval → Publishing → add a trusted publisher for this repository,
# workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
